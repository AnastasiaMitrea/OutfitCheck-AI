name: CI Pipeline

on:
  push:
    branches: [ main, maria ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install dependencies
      run: npm install
      working-directory: ./frontend
    - name: Run Tests
      run: npm test
      working-directory: ./frontend
