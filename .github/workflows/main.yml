name: CI Pipeline

on:
  push:
    branches: [ "Sonia", "main" ]
  pull_request:
    branches: [ "Sonia", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests (Evals)
      run: |
        pytest tests/
